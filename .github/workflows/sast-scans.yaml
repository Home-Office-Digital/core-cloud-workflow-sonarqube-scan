name: SAST Scans
 
on:
  workflow_call:
    inputs:
      runner:
        description: 'For use with a specific runner'
        type: string
        required: false
        default: 'ubuntu-latest'
    secrets:
      sonar_token:
        required: true
      sonar_host_url:
        required: true
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write

jobs:
  checkov-scan:
    uses: Home-Office-Digital/core-cloud-workflow-checkov-sast-scan/.github/workflows/checkov-scan-base.yaml@1.7.0
    with:
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
  sonarqube-scanner:
    uses: Home-Office-Digital/core-cloud-workflow-sonarqube-scan/.github/workflows/sonarqube-scan.yaml@1.1.8
    with:
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
    secrets:
      sonar_token: ${{ secrets.sonar_token }}
      sonar_host_url: ${{ secrets.sonar_host_url }}
